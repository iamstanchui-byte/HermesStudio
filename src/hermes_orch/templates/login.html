<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — Hermes Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --gradient-from: #3b82f6;
            --gradient-to: #9333ea;
        }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        /* Light mode (default) */
        body {
            background: #f3f4f6;
            color: #111827;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse at 0% 0%, rgba(59, 130, 246, 0.08), transparent 50%),
                radial-gradient(ellipse at 100% 100%, rgba(147, 51, 234, 0.06), transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .login-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04);
        }
        .field-label {
            display: block; font-size: 0.75rem; font-weight: 500;
            color: #374151; margin-bottom: 0.375rem;
        }
        .field-input {
            display: block; width: 100%;
            padding: 0.625rem 0.875rem 0.625rem 2.5rem;
            border: 1px solid #d1d5db; border-radius: 0.5rem;
            font-size: 0.9375rem; color: #111827;
            background: #ffffff;
            transition: all 0.15s;
        }
        .field-input::placeholder { color: #9ca3af; }
        .field-input:focus {
            outline: none; border-color: var(--gradient-from);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .field-icon {
            position: absolute; left: 0.875rem; top: 50%; transform: translateY(-50%);
            color: #9ca3af; pointer-events: none;
        }
        .field-toggle-eye {
            position: absolute; right: 0.625rem; top: 50%; transform: translateY(-50%);
            color: #9ca3af; cursor: pointer; padding: 0.25rem;
            background: none; border: none; display: flex;
        }
        .field-toggle-eye:hover { color: #6b7280; }
        .btn-primary {
            display: flex; align-items: center; justify-content: center;
            width: 100%; padding: 0.75rem;
            background: linear-gradient(135deg, var(--gradient-from) 0%, var(--gradient-to) 100%);
            color: white; border: none; border-radius: 0.5rem;
            font-size: 0.9375rem; font-weight: 600;
            cursor: pointer; transition: all 0.15s;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
            transform: translateY(-1px);
        }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .pill-error {
            background: #fef2f2; color: #b91c1c;
            padding: 0.625rem 0.875rem; border-radius: 0.5rem;
            font-size: 0.8125rem; margin-bottom: 1rem;
            border: 1px solid #fecaca;
        }
        .wordmark-hermes { color: #111827; font-weight: 800; letter-spacing: 0.18em; }
        .wordmark-nexus {
            background: linear-gradient(90deg, var(--gradient-from), var(--gradient-to));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            font-weight: 800; letter-spacing: 0.32em;
        }
        .divider {
            display: flex; align-items: center; gap: 0.75rem;
            color: #9ca3af; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em;
            margin: 1.25rem 0 0.75rem;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: #e5e7eb;
        }
        .help-text { font-size: 0.8125rem; color: #6b7280; line-height: 1.5; }
        .help-text code {
            background: #f3f4f6; padding: 0.125rem 0.375rem; border-radius: 0.25rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.75rem;
            color: #1f2937;
        }
        .theme-toggle {
            position: fixed; top: 1.25rem; right: 1.25rem; z-index: 50;
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px);
            border: 1px solid #e5e7eb; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: #6b7280; transition: all 0.15s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .theme-toggle:hover { color: #1f2937; transform: scale(1.05); }

        /* Dark mode */
        body.dark { background: #0a0e27; color: #e2e8f0; }
        body.dark::before {
            background:
                radial-gradient(ellipse at 0% 0%, rgba(59, 130, 246, 0.18), transparent 50%),
                radial-gradient(ellipse at 100% 100%, rgba(147, 51, 234, 0.15), transparent 50%),
                radial-gradient(2px 2px at 20% 30%, rgba(255, 255, 255, 0.5), transparent 100%),
                radial-gradient(1px 1px at 60% 20%, rgba(255, 255, 255, 0.4), transparent 100%),
                radial-gradient(1.5px 1.5px at 80% 50%, rgba(255, 255, 255, 0.45), transparent 100%),
                radial-gradient(1px 1px at 15% 70%, rgba(255, 255, 255, 0.35), transparent 100%),
                radial-gradient(2px 2px at 90% 85%, rgba(255, 255, 255, 0.4), transparent 100%),
                radial-gradient(1px 1px at 35% 85%, rgba(255, 255, 255, 0.5), transparent 100%),
                radial-gradient(1.5px 1.5px at 70% 75%, rgba(255, 255, 255, 0.3), transparent 100%),
                radial-gradient(1px 1px at 45% 15%, rgba(255, 255, 255, 0.4), transparent 100%),
                radial-gradient(2px 2px at 5% 50%, rgba(255, 255, 255, 0.35), transparent 100%),
                radial-gradient(1px 1px at 50% 45%, rgba(255, 255, 255, 0.4), transparent 100%),
                radial-gradient(1.5px 1.5px at 25% 25%, rgba(255, 255, 255, 0.4), transparent 100%);
        }
        body.dark .login-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(148, 163, 184, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
        }
        body.dark .field-label { color: #cbd5e1; }
        body.dark .field-input {
            background: rgba(15, 23, 42, 0.5);
            border-color: rgba(148, 163, 184, 0.2);
            color: #f1f5f9;
        }
        body.dark .field-input::placeholder { color: #64748b; }
        body.dark .field-input:focus {
            border-color: var(--gradient-from);
            background: rgba(15, 23, 42, 0.7);
        }
        body.dark .field-icon { color: #64748b; }
        body.dark .field-toggle-eye { color: #64748b; }
        body.dark .field-toggle-eye:hover { color: #cbd5e1; }
        body.dark .pill-error {
            background: rgba(127, 29, 29, 0.3);
            color: #fecaca; border-color: rgba(248, 113, 113, 0.3);
        }
        body.dark .wordmark-hermes { color: #f1f5f9; }
        body.dark .divider { color: #64748b; }
        body.dark .divider::before, body.dark .divider::after { background: rgba(148, 163, 184, 0.2); }
        body.dark .help-text { color: #94a3b8; }
        body.dark .help-text code {
            background: rgba(15, 23, 42, 0.6); color: #e2e8f0;
        }
        body.dark .theme-toggle {
            background: rgba(30, 41, 59, 0.8);
            border-color: rgba(148, 163, 184, 0.2);
            color: #cbd5e1;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        body.dark .theme-toggle:hover { color: #f1f5f9; }
        body.dark .footer-text { color: #64748b; }
        .footer-text { color: #9ca3af; }

        @media (max-width: 480px) {
            .login-card { border-radius: 1rem; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-8">
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
        <svg id="theme-icon-light" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="theme-icon-dark" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>

    <div class="w-full max-w-[420px] relative z-10">
        <div class="text-center mb-6">
            <div id="hexagon" class="mx-auto mb-4" style="width: 120px; height: 120px; background-size: contain; background-repeat: no-repeat; background-position: center;"></div>
            <div class="text-[20px] leading-none mb-3">
                <span class="wordmark-hermes">HERMES</span>
            </div>
            <div class="text-[14px] leading-none mb-4">
                <span class="wordmark-nexus">NEXUS</span>
            </div>
            <h1 class="text-2xl font-semibold tracking-tight">Sign in to Hermes Nexus</h1>
        </div>

        <div class="login-card rounded-2xl p-8">
            <div id="error-box" class="pill-error" style="display: none;"></div>

            <form id="login-form" autocomplete="on" novalidate>
                <input type="hidden" name="next" value="{{ next }}">

                <div class="mb-4">
                    <label class="field-label" for="username">Username</label>
                    <div class="relative">
                        <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input id="username" name="username" type="text" required
                               autocomplete="username" autofocus
                               placeholder="Enter your username"
                               class="field-input">
                    </div>
                </div>

                <div class="mb-5">
                    <label class="field-label" for="password">Password</label>
                    <div class="relative">
                        <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input id="password" name="password" type="password" required
                               autocomplete="current-password"
                               placeholder="Enter your password"
                               class="field-input" style="padding-right: 2.75rem;">
                        <button type="button" id="toggle-pw" class="field-toggle-eye" aria-label="Toggle password visibility">
                            <svg id="eye-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                            <svg id="eye-on" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn-primary">
                    Sign in
                </button>
            </form>

            <div class="divider">or</div>

            <div class="help-text">
                <div class="font-medium mb-1.5" style="color: #374151;">Forgot your password?</div>
                <div>
                    Ask your admin to reset it on the server:
                    <code>hermes-orch user passwd &lt;username&gt;</code>
                </div>
            </div>
        </div>

        <p class="footer-text text-[11px] mt-5 text-center">
            First time? Run <code style="background: rgba(0,0,0,0.04); padding: 0.1rem 0.35rem; border-radius: 0.2rem;">hermes-orch init</code> on the server to create the admin.
        </p>
    </div>

    <script>
        // === Theme: localStorage > prefers-color-scheme > light ===
        (function() {
            const STORAGE_KEY = 'orch.theme';
            const stored = localStorage.getItem(STORAGE_KEY);
            const initial = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (initial === 'dark') document.body.classList.add('dark');
            updateThemeIcon();
        })();
        function updateThemeIcon() {
            const isDark = document.body.classList.contains('dark');
            document.getElementById('theme-icon-light').style.display = isDark ? 'none' : 'block';
            document.getElementById('theme-icon-dark').style.display = isDark ? 'block' : 'none';
            updateHexagon();
        }
        function updateHexagon() {
            const isDark = document.body.classList.contains('dark');
            const hex = document.getElementById('hexagon');
            hex.style.backgroundImage = isDark
                ? "url('/static/logos/hermes-nexus-icon-dark.png?v=20260731-2326')"
                : "url('/static/logos/hermes-nexus-icon-light.png?v=20260731-2326')";
        }
        document.getElementById('theme-toggle').addEventListener('click', () => {
            const isDark = document.body.classList.toggle('dark');
            localStorage.setItem('orch.theme', isDark ? 'dark' : 'light');
            updateThemeIcon();
        });
        // Set hexagon on initial load
        updateHexagon();

        // === Password visibility toggle ===
        const pwInput = document.getElementById('password');
        const togglePw = document.getElementById('toggle-pw');
        const eyeOff = document.getElementById('eye-off');
        const eyeOn = document.getElementById('eye-on');
        togglePw.addEventListener('click', () => {
            const isPw = pwInput.type === 'password';
            pwInput.type = isPw ? 'text' : 'password';
            eyeOff.style.display = isPw ? 'none' : 'block';
            eyeOn.style.display = isPw ? 'block' : 'none';
        });

        // === Form submission ===
        const form = document.getElementById('login-form');
        const errorBox = document.getElementById('error-box');
        const submitBtn = document.getElementById('submit-btn');

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }
        function hideError() {
            errorBox.textContent = '';
            errorBox.style.display = 'none';
        }

        const url = new URL(window.location.href);
        const errParam = url.searchParams.get('error');
        if (errParam) showError(errParam);

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            submitBtn.disabled = true;
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Signing in...';

            const fd = new FormData(form);
            const username = fd.get('username').trim();
            const password = fd.get('password');
            const next = fd.get('next') || '/agents';

            try {
                const r = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'same-origin',
                    body: JSON.stringify({username, password}),
                });
                if (r.ok) {
                    const safe = next.startsWith('/') && !next.startsWith('//') ? next : '/agents';
                    window.location.href = safe;
                    return;
                }
                const data = await r.json().catch(() => ({}));
                const detail = data.detail;
                if (detail && detail.must_set_password) {
                    const u = encodeURIComponent(detail.username || 'admin');
                    window.location.href = `/setup-password?username=${u}`;
                    return;
                }
                showError(typeof detail === 'string' ? detail : (detail?.message || 'Sign in failed'));
            } catch (err) {
                showError('Network error: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });
    </script>
</body>
</html>
