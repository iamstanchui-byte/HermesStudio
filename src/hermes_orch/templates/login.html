<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — Hermes Orchestrator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .login-card { max-width: 420px; margin: 0 auto; }
        .pill-error {
            background: #fee2e2; color: #991b1b;
            padding: 0.5rem 0.75rem; border-radius: 0.375rem;
            font-size: 0.8rem; margin-bottom: 0.75rem;
        }
        .field-label {
            display: block; font-size: 0.75rem; font-weight: 500;
            color: #374151; margin-bottom: 0.25rem;
        }
        .field-input {
            display: block; width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid #d1d5db; border-radius: 0.375rem;
            font-size: 0.875rem;
        }
        .field-input:focus {
            outline: none; border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .btn-primary {
            display: block; width: 100%;
            padding: 0.5rem 0.75rem;
            background: #2563eb; color: white;
            border: none; border-radius: 0.375rem;
            font-size: 0.875rem; font-weight: 500;
            cursor: pointer;
        }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-primary:disabled { background: #9ca3af; cursor: not-allowed; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">
    <div class="login-card w-full">
        <div class="text-center mb-6">
            <div class="flex items-center justify-center gap-2 mb-2">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white text-lg font-bold">H</div>
                <div class="text-left">
                    <div class="text-base font-bold text-gray-800">HERMES</div>
                    <div class="text-xs text-gray-500 -mt-0.5">NEXUS</div>
                </div>
            </div>
            <h1 class="text-xl font-semibold text-gray-800">Sign in</h1>
            <p class="text-xs text-gray-500 mt-1">Hermes Orchestrator dashboard</p>
        </div>

        <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-6">
            <div id="error-box" class="pill-error" style="display: none;"></div>

            <form id="login-form" autocomplete="on">
                <input type="hidden" name="next" value="{{ next }}">

                <div class="mb-3">
                    <label class="field-label" for="username">Username</label>
                    <input id="username" name="username" type="text" required
                           autocomplete="username" autofocus
                           class="field-input">
                </div>

                <div class="mb-4">
                    <label class="field-label" for="password">Password</label>
                    <input id="password" name="password" type="password" required
                           autocomplete="current-password"
                           class="field-input">
                </div>

                <button type="submit" id="submit-btn" class="btn-primary">
                    Sign in
                </button>
            </form>
        </div>

        <p class="text-[11px] text-gray-400 mt-4 text-center">
            First time? Run <code class="bg-gray-100 px-1 py-0.5 rounded">hermes-orch init</code>
            on the server to create the admin user.
        </p>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const errorBox = document.getElementById('error-box');
        const submitBtn = document.getElementById('submit-btn');

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }
        function hideError() {
            errorBox.textContent = '';
            errorBox.style.display = 'none';
        }

        // Server-side error from query string (e.g. /login?error=session_expired)
        const url = new URL(window.location.href);
        const errParam = url.searchParams.get('error');
        if (errParam) showError(errParam);

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            const fd = new FormData(form);
            const username = fd.get('username').trim();
            const password = fd.get('password');
            const next = fd.get('next') || '/agents';

            try {
                const r = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'same-origin',
                    body: JSON.stringify({username, password}),
                });
                if (r.ok) {
                    // Redirect to next (defensively check it's a local URL)
                    const safe = next.startsWith('/') && !next.startsWith('//') ? next : '/agents';
                    window.location.href = safe;
                    return;
                }
                const data = await r.json().catch(() => ({}));
                // Bootstrap admin with no password set → redirect to setup
                const detail = data.detail;
                if (detail && detail.must_set_password) {
                    const u = encodeURIComponent(detail.username || 'admin');
                    window.location.href = `/setup-password?username=${u}`;
                    return;
                }
                showError(typeof detail === 'string' ? detail : (detail?.message || 'Sign in failed'));
            } catch (err) {
                showError('Network error: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign in';
            }
        });
    </script>
</body>
</html>
