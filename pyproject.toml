[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-orchestrator"
version = "0.10.0"
description = "Local network multi-agent orchestrator for Hermes runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Stanley" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "click>=8.1.7",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    # Recurring project schedules (cron parsing for /api/schedules).
    # croniter gives us parse + get_next() in one library; ~150KB pure-Python.
    "croniter>=2.0.5",
    # IANA timezone database — Windows Python doesn't ship it, so
    # zoneinfo.ZoneInfo('Asia/Hong_Kong') would fail with
    # ZoneInfoNotFoundError. tzdata is a small pure-Python fallback
    # (~300KB) that ships the tzdata2024a+ database.
    "tzdata>=2024.1",
    # v3.4 dashboard user auth — bcrypt password hashing + itsdangerous
    # signed cookies. bcrypt has a 72-byte input cap (we pre-hash with
    # SHA-256 for longer passwords). itsdangerous TimestampSigner
    # provides tamper-detection + max-age expiry on the session cookie.
    "bcrypt>=4.0.0",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
hermes-orch = "hermes_orch.cli:cli"
hermes-orch-agent = "hermes_orch.agent_cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
